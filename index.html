<html lang="en">

<title>Fib Finder</title>
<style>

  #how b { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--ink); font-size: 17px; }

<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<div id="app">
  <header><h1>Fib <span>Finder</span></h1><span id="rn"></span><input id="name" maxlength="14" placeholder="Your name" aria-label="Your name"></header>
  <div id="bar"><i></i></div>
  <main>
    <div id="qcard"><div id="tag">Fib Finder</div><div id="q">Connecting…</div></div>
    <div id="sub"></div>
    <div id="how" hidden>
      <div><b>1</b>A true fact appears with one word missing. The real answer is always strange.</div>
      <div><b>2</b>Write a fake answer that sounds true. Nobody sees it until the vote.</div>
      <div><b>3</b>Find the real one among the fakes. Fool others to score too.</div>
    </div>
    <form id="write" hidden><input id="fib" maxlength="48" placeholder="Write a fake answer…" autocomplete="off" enterkeyhint="send" aria-label="Your fake answer"><button>Lock in</button></form>
    <div id="opts" hidden></div>
    <div id="players"></div>
  </main>
  <div id="net"></div>
</div>
<canvas id="fx"></canvas>
<div id="over" hidden><div class="card">
  <h2 id="oTitle"></h2><div id="oSub"></div><ol id="ranks"></ol>
  <h3>Best games ever</h3><ol id="board10"><li>Loading the leaderboard…</li></ol>
  <button class="go" id="again">Play again</button><div id="oNext"></div>
</div></div>
<script>
/* ═══ FIB FINDER · a Multiplayer Agent starter ══════════════════════════════════════════
 * A strange true fact with a word missing. Everyone writes a fake. Find the truth.
 * Party, 3–10 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, scoring, seats, how the bots play
 *   QUESTIONS ..... the facts. q has "____" where the answer goes, a is the true answer,
 *                   f are fakes the bots may write. Add, remove or swap them freely.
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRETS  the Seal helper: a fake answer is encrypted so only the host can read it
 *   GAME (HOST) ... the phases (lobby, write, vote, reveal, results), building the answer list,
 *                   scoring, taking over as a new host
 *   BOTS (HOST) ... when bots finish writing and what they vote for
 *   ME ............ writing my fake, voting, handing my fake to a new host
 *   SCREEN ........ question card, answer cards, the reveal, players, results, leaderboard, effects
 *   MAIN LOOP ..... heartbeat, host check, autopilot for ?attract
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole game lives in ONE shared field, `game`: {id, v, ph, n, seed, at, endsAt, opts,
 *     key, truth, votes, gained, scores, bots, ready}. Only the HOST writes it; `v` goes up on
 *     every write. The host is the lowest sessionId among live players (heartbeat in the last 3s).
 *   - Which question each round asks comes from game.seed, so every player agrees.
 *   - FAKES ARE HIDDEN until the vote: each player writes its fake into its OWN entity as `fib`
 *     = {k, h, box}, where box is SEALED to the host (h) so nobody else can read it. When the host
 *     changes, every player re-seals its fake to the new host. The host (only) opens them and,
 *     when writing ends, publishes the shuffled answers (fakes + the truth) in game.opts, with no
 *     names. Who wrote what (game.key) is published at the reveal.
 *   - Votes: each player writes `vote` = {k, o} (k = "game.round", o = the answer's index) into
 *     its own entity. The host reads them when voting ends and scores everyone at once.
 *   - Bots' fakes come from the question's own list, picked with game.seed, so a new host can
 *     work them out again. Their progress (wrote / voted) lives in game.bots.
 *   - Timers are timestamps in `game` (endsAt); a new host carries on from them.
 *   - Intent: "ready" (Play again on the results screen). Everything else is entity fields.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fib-points": each player's best game.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  rounds: 5,              // questions per game
  seats: 5,               // bots fill the room up to this many players
  maxPlayers: 10,         // more people than this watch until the next game
  lobbyMs: 6000,          // countdown before a game
  writeMs: 45000,         // time to write a fake answer
  voteMs: 25000,          // time to vote
  hurryMs: 1500,          // once everyone is in, the phase ends this much later
  revealLeadMs: 900,      // the reveal waits this long before the first answer flips
  revealStepMs: 1700,     // each answer gets this long on the reveal
  revealEndMs: 4000,      // the round's points stay up this long after the last answer
  resultsMs: 16000,       // the results screen
  graceMs: 2500,          // a new host waits this long for everyone's fake to be re-sealed to it
  fibMax: 48,             // characters in a fake answer
  truthPoints: 1000,      // for picking the real answer
  foolPoints: 500,        // for every player who picks your fake
  botTruth: 0.45,         // chance a bot finds the real answer
  botWriteAt: [0.12, 0.55], // when a bot finishes writing (share of the writing time)
  botVoteAt: [0.2, 0.75],   // when a bot votes (share of the voting time)
  board: "fib-points",    // leaderboard name
};
const BOT_NAMES = ["Fibbly", "Whopper", "Tall Tale", "Bluffy", "Noodle", "Pocket", "Sly", "Dot", "Waffles"];
const FRIENDLY = ["Sunny", "Pip", "Biscuit", "Maple", "Pickle", "Wren", "Taco", "Echo", "Juniper", "Clover"];
const COLORS = ["#ff6b57", "#4c8dff", "#20b486", "#f5a524", "#9b5de5", "#00a8b5", "#ef4f9b", "#7a9a01", "#e2703a", "#5562e8"];
// Bots use these when the question's own fakes run out.
const GENERIC_FIBS = ["a rubber duck", "Tuesdays", "exactly seven", "spaghetti", "a tiny hat", "jazz music", "pure glue", "the color blue", "grandma", "nobody knows why"];

// ── QUESTIONS ───────────────────────────────────────────────────────────────────────
// Every one is TRUE. q: the fact with "____" for the missing answer. a: the real answer.
// f: fakes the bots can write (players write their own).
const QUESTIONS = [

  { q: "The Sahara Desert used to be ____.", a: "green", f: ["covered in ice", "one giant volcano", "made of salt"] },

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'fib-finder',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

async function connect() {

let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);

let hostHold = 0, lastTick = performance.now(); // after a freeze, no hosting before hostHold (see frame())
/** A tab whose loop has stopped doesn't host, nor for 0.7s after it wakes: the newer state lands first. */
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().slice(0, CONFIG.maxPlayers);
const pkOf = (id) => (id === net.sessionId ? Seal.pub : S.entities.players?.[id]?.pk);

// ── SEALED SECRETS ──────────────────────────────────────────────────────────────────
// Hidden info in a relay room. Everything in room state reaches every client, so a secret
// (a fake answer before the vote) is written SEALED: encrypted so only its one reader can open
// it. Each player publishes a public key in its own entity (`pk`); a player seals its fake to
// the host's key and writes the box into its own `fib` field.
//   - Only the host can open the fakes (it builds the answer list). Fine for friends, not cheat-proof.
//   - A new host can't open boxes sealed to the old host, so on a host change every player
//     re-seals its own fake to the new one.
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
//   - NEVER plaintext online: with no key for the recipient, seal() returns "" (an empty box).
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",

  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
// The host's private memory: the fakes it has opened, and the bots' plan for this phase.
const host = { last: null, was: false, fibs: new Map(), opened: new Map(), plan: null, graceUntil: 0 };

/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  const g = cached("game", S.shared.game, null);

}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const patch = (changes) => writeGame({ ...game(), ...changes });
const newGame = (id) => ({ id, ph: "lobby", n: 0, seed: (Math.random() * 1e9) | 0, at: Date.now(), endsAt: Date.now() + CONFIG.lobbyMs,
  opts: [], key: null, truth: -1, votes: {}, gained: {}, scores: {}, bots: [], ready: [] });
const roundKey = (g) => `${g.id}.${g.n}`;
const isBot = (g, id) => !!g && g.bots.some((b) => b.i === id);
const nameIn = (g, id) => (id === net.sessionId ? myName : g && g.bots.find((b) => b.i === id)?.n) || String(S.entities.players?.[id]?.n ?? "Player").slice(0, 14);
const colorIn = (g, id) => (id === net.sessionId ? myColor : g && g.bots.find((b) => b.i === id)?.c) || S.entities.players?.[id]?.c || "#8890b0";
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a, r = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/** Compare answers loosely: case, spaces, punctuation and a leading "a/an/the" don't count. */
const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim().replace(/^(a|an|the) /, "");

/** This game's questions in order: the same for everyone with the same seed. */
let orderFor = null, order = [];
function questionOf(g) {

  return QUESTIONS[order[g.n % order.length]];
}
/** The bots' fakes this round: picked with the seed, so any host works out the same ones. */

/** Become host: carry on from state. Players re-seal their fakes to me; I wait a moment for them. */
function adopt() {
  host.was = true; host.last = null; host.plan = null; host.fibs.clear(); host.opened.clear();
  host.graceUntil = performance.now() + (net.offline ? 0 : CONFIG.graceMs);
}

function hostTick() {
  if (!host.was) adopt();
  const t = Date.now();
  let g = game();
  if (!g) g = writeGame(newGame(1));
  if (g.ph === "lobby" && t >= g.endsAt) startGame(g, t);
  else if (g.ph === "write") writeTick(g, t);
  else if (g.ph === "vote") voteTick(g, t);
  else if (g.ph === "reveal" && t >= g.endsAt) nextRound(g, t);
  else if (g.ph === "results" && t >= g.endsAt) writeGame(newGame(g.id + 1));
}

function startGame(g, t) {
  const hs = humans(), names = shuffle([...BOT_NAMES]), used = new Set(hs.map((id) => colorIn(g, id)));
  const free = COLORS.filter((c) => !used.has(c));
  const bots = Array.from({ length: Math.max(0, CONFIG.seats - hs.length) }, (_, k) => ({ i: "bot" + (k + 1), n: names[k % names.length], c: free[k % free.length] || COLORS[k], f: 0, v: -1 }));
  host.fibs.clear();
  patch({ ph: "write", n: 0, at: t, endsAt: t + CONFIG.writeMs, opts: [], key: null, truth: -1, votes: {}, gained: {}, scores: {}, bots, ready: [] });

/** Open every fake sealed to me this round (each box once). */
function openFibs(g) {

  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId) continue;
    const f = cached("fib:" + id, p.fib, null);
    if (!f || f.k !== k || f.h !== net.sessionId || typeof f.box !== "string" || !f.box) continue;
    if (host.opened.has(f.box)) { const txt = host.opened.get(f.box); if (txt) host.fibs.set(id, { k, t: txt }); continue; }
    if (!pkOf(id)) continue;
    host.opened.set(f.box, "");

/** Everyone is in: the phase ends a moment later. */

/** Writing is over: the truth plus every different fake, shuffled, with no names on them. */
function toVote(g, t) {

  const texts = [...[...host.fibs.values()].filter((f) => f.k === k).map((f) => f.t), ...g.bots.filter((b) => b.f).map((b) => bf[b.i])];

/** A player's vote this round (the answer's index), or -1. */
function voteOf(g, id) {
  const v = id === net.sessionId ? myVote : cached("vote:" + id, S.entities.players?.[id]?.vote, null);
  return v && v.k === roundKey(g) && typeof v.o === "number" && v.o >= 0 && v.o < g.opts.length ? v.o : -1;
}

function voteTick(g, t) {

  for (const b of g.bots) if (b.f) fibs[b.i] = norm(bf[b.i]);
  const key = g.opts.map((o, i) => (i === truth ? [] : Object.keys(fibs).filter((id) => fibs[id] === norm(o))));

  for (const id of Object.keys(S.entities.players || {})) { const o = voteOf(g, id); if (o >= 0 && !key[o].includes(id)) votes[id] = o; }

  const ready = [...g.ready, from];
  patch({ ready, endsAt: humans().every((id) => ready.includes(id)) ? Math.min(g.endsAt, Date.now() + 1500) : g.endsAt });

// ── BOTS (HOST) ─────────────────────────────────────────────────────────────────────
/** The bots' timetable for this phase (a new host makes its own; overdue ones happen at once). */

  return host.plan;

// ── ME ──────────────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0];
let myFib = null;  // my fake this round: {k, t, h}; h = the host it is sealed to
let myVote = null; // {k, o}
let sealing = false;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
if (!myName) myName = pick(FRIENDLY) + " " + (10 + Math.floor(Math.random() * 90));

function submitFib(text) {
  const g = game();
  if (!g || g.ph !== "write") return;
  text = cleanFib(text);
  if (!text) return;
  if (norm(text) === norm(questionOf(g).a)) { flash("That's the real answer! Write a fake one.", true); return; }
  myFib = { k: roundKey(g), t: text, h: "" };
  syncFib();
  tone(660, 90); setTimeout(() => tone(990, 140), 90);
}
/** Keep my fake sealed to whoever is host right now (re-seal when the host changes). */
async function syncFib() {
  const g = game(), f = myFib;
  if (!g || !f || sealing || f.k !== roundKey(g) || (g.ph !== "write" && g.ph !== "vote")) return;
  const h = livePlayers()[0], pk = pkOf(h);
  if (f.h === h || (!pk && Seal.on && !net.offline)) return;
  sealing = true;
  try {
    const box = net.offline ? "" : await Seal.seal(pk, { k: f.k, t: f.t });
    if (myFib !== f || (!box && !net.offline)) return;

function vote(o) {
  const g = game();
  if (!g || g.ph !== "vote" || o === mineIdx(g) || !(o >= 0 && o < g.opts.length)) return;
  myVote = { k: roundKey(g), o };
  net.me.set("vote", JSON.stringify(myVote));
  tone(520, 80);
}

// ── SCREEN ──────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);

const setHtml = (el, html) => { if (el.dataset.v !== html) { el.dataset.v = html; el.innerHTML = html; } };

const fx = $("fx"), fctx = fx.getContext("2d");

function fit() { DPR = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * DPR; fx.height = innerHeight * DPR; fx.style.width = innerWidth + "px"; fx.style.height = innerHeight + "px"; }

let flashMsg = "", flashUntil = 0, flashWarn = false;

/** The reveal order: fakes with the fewest votes first, the truth last. */
function revealOrder(g) {
  const count = (i) => Object.values(g.votes).filter((o) => o === i).length;
  return g.opts.map((_, i) => i).filter((i) => i !== g.truth).sort((a, b) => count(a) - count(b) || a - b).concat(g.truth >= 0 ? [g.truth] : []);
}
/** How many answers have flipped on the reveal so far. */
const revealedCount = (g) => (g.ph === "reveal" ? Math.max(0, Math.min(g.opts.length, Math.floor((Date.now() - g.at - CONFIG.revealLeadMs) / CONFIG.revealStepMs) + 1)) : 0);

/** Everyone in the game, people first in seat order, then the bots. */
function roster(g) {
  const ids = [...new Set([...humans(), ...(g ? g.bots.map((b) => b.i) : [])])];
  return ids.map((id) => ({ id, n: nameIn(g, id), c: colorIn(g, id), me: id === net.sessionId, bot: isBot(g, id) }));
}
const hasWritten = (g, id) => { if (isBot(g, id)) return !!g.bots.find((b) => b.i === id).f; const f = id === net.sessionId ? myFib : cached("fib:" + id, S.entities.players?.[id]?.fib, null); return !!f && f.k === roundKey(g) && (id !== net.sessionId || !!f.h); };
const hasVoted = (g, id) => (isBot(g, id) ? g.bots.find((b) => b.i === id).v >= 0 : voteOf(g, id) >= 0);

let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function render(g) {
  const n = humans().length;
  setText($("net"), ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the game" : ""}`);
  if (!g) return;
  const t = Date.now(), left = Math.max(0, g.endsAt - t), q = questionOf(g);
  const span = { lobby: CONFIG.lobbyMs, write: CONFIG.writeMs, vote: CONFIG.voteMs, results: CONFIG.resultsMs }[g.ph] || Math.max(1, g.endsAt - g.at);
  $("bar").firstElementChild.style.transform = `scaleX(${Math.min(1, left / span).toFixed(3)})`;
  setText($("rn"), g.ph === "lobby" || g.ph === "results" ? "" : `Round ${g.n + 1} of ${CONFIG.rounds}`);
  $("name").hidden = ATTRACT || g.ph !== "lobby";
  const live = g.ph !== "lobby" && g.ph !== "results";
  $("how").hidden = g.ph !== "lobby";
  // the question card
  const reveal = g.ph === "reveal", flips = reveal ? revealOrder(g) : [], shown = revealedCount(g), truthOut = reveal && shown >= g.opts.length;
  setText($("tag"), { lobby: "How to play", write: "Write a fake", vote: "Find the truth", reveal: truthOut ? "The truth" : "The reveal", results: "Game over" }[g.ph]);
  const [before, after] = q.q.split("____");
  const qHtml = g.ph === "lobby" ? `Next game in ${Math.ceil(left / 1000)}…` : g.ph === "results" ? "Thanks for playing!"
    : `${esc(before)}${truthOut ? `<span class="fill">${esc(q.a)}</span>` : '<span class="blank">&nbsp;</span>'}${esc(after ?? "")}`;
  setHtml($("q"), qHtml);
  // the line under it
  let sub = "";
  const wrote = myFib && myFib.k === roundKey(g);
  if (performance.now() < flashUntil) sub = flashMsg;
  else if (g.ph === "lobby") sub = `${CONFIG.rounds} rounds. Bots join if the room is small.`;
  else if (g.ph === "write") sub = wrote ? `Locked in: “${myFib.t}”. You can change it. ${Math.ceil(left / 1000)}s` : `Write something that sounds true. ${Math.ceil(left / 1000)}s`;
  else if (g.ph === "vote") sub = myVote && myVote.k === roundKey(g) ? `Picked. Tap another to switch. ${Math.ceil(left / 1000)}s` : `Which one is real? ${Math.ceil(left / 1000)}s`;
  else if (reveal) sub = truthOut ? (g.votes[net.sessionId] === g.truth ? `You found it! +${g.gained[net.sessionId] || 0}` : g.gained[net.sessionId] ? `You fooled people: +${g.gained[net.sessionId]}` : "Fooled this time.") : "Who wrote what…";
  setText($("sub"), sub);
  $("sub").className = performance.now() < flashUntil && flashWarn ? "warn" : "";
  // writing
  $("write").hidden = g.ph !== "write";
  $("write").querySelector("button").textContent = wrote ? "Change" : "Lock in";
  // the answers
  $("opts").hidden = !(g.ph === "vote" || reveal);
  $("opts").classList.toggle("few", g.opts.length <= 5);
  if (g.ph === "vote" || reveal) renderOpts(g, flips, shown);
  // the players
  const people = roster(g).map((p) => ({ ...p, s: (g.scores[p.id] || 0) - (reveal && !truthOut ? g.gained[p.id] || 0 : 0) })) // the round's points land when the truth flips.sort((a, b) => (live || g.ph === "results" ? b.s - a.s : 0));
  setHtml($("players"), people.map((p) => {
    const done = (g.ph === "write" && hasWritten(g, p.id)) || (g.ph === "vote" && hasVoted(g, p.id));
    const gain = reveal && truthOut && g.gained[p.id] ? ` <span class="gain">+${g.gained[p.id]}</span>` : "";
    return `<div class="p ${p.me ? "me" : ""} ${done ? "in" : ""}"><span class="av" style="background:${esc(p.c)}">${esc(p.n[0] || "?")}</span>${esc(p.n)}${g.ph !== "lobby" ? ` <em>${p.s}</em>` : ""}${gain}</div>`;
  }).join(""));
  renderOver(g);
}

function renderOpts(g, flips, shown) {
  const mine = mineIdx(g), picked = g.ph === "vote" ? voteOf(g, net.sessionId) : g.votes[net.sessionId] ?? -1;
  const html = g.opts.map((o, i) => {
    const cls = ["o"];
    let extra = "";
    if (g.ph === "vote") { if (i === mine) cls.push("mine"); if (i === picked) cls.push("picked"); }
    else {
      const pos = flips.indexOf(i), out = pos < shown;
      if (!out) cls.push("wait");
      else {
        cls.push(i === g.truth ? "true" : "fake");
        if (pos === shown - 1) cls.push("now");
        const by = (g.key[i] || []).map((id) => nameIn(g, id)), voters = Object.keys(g.votes).filter((id) => g.votes[id] === i);
        extra = `<span class="meta"><span class="who">${i === g.truth ? "THE TRUTH" : by.length ? "Fib by " + esc(by.join(" & ")) : "A fib"}${i !== g.truth && voters.length && by.length ? ` · fooled ${voters.length}` : ""}</span>`
          + (voters.length ? `<span class="vs">${voters.map((id) => `<span class="dot" style="background:${esc(colorIn(g, id))}" title="${esc(nameIn(g, id))}">${esc(nameIn(g, id)[0])}</span>`).join("")}</span>` : "") + "</span>";
      }
      if (i === picked) cls.push("picked");
    }
    return `<button class="${cls.join(" ")}" data-o="${i}"><span>${esc(cap(o))}</span>${extra}</button>`;
  }).join("");
  setHtml($("opts"), html);
}

let boardFor = -1, lb = null;
function renderOver(g) {
  $("over").hidden = g.ph !== "results";
  if (g.ph !== "results") return;
  const ranked = roster(g).map((p) => ({ ...p, s: g.scores[p.id] || 0 })).sort((a, b) => b.s - a.s);
  const top = ranked[0], tie = ranked[1] && top && ranked[1].s === top.s;
  setText($("oTitle"), !top || !top.s ? "Game over" : tie ? "It's a tie!" : top.me ? "You win!" : `${top.n} wins!`);
  setText($("oSub"), `You scored ${g.scores[net.sessionId] || 0}`);
  setHtml($("ranks"), ranked.map((r, i) => `<li style="${r.me ? "font-weight:800" : ""}">${["🥇", "🥈", "🥉"][i] || ""} ${esc(r.n)}<span>${r.s}</span></li>`).join(""));
  setText($("oNext"), `Next game in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`);
  setText($("again"), g.ready.includes(net.sessionId) ? "Ready ✓" : "Play again");
  if (boardFor === g.id) return;
  boardFor = g.id;
  const list = $("board10"), score = g.scores[net.sessionId] || 0;
  if (!lb) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (score > 0 ? lb.submit(score).catch(() => null) : Promise.resolve()).then(() => lb.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. Win one.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}

// Sounds and confetti: effects only, nothing here decides anything.
let AC = null;
function unlockAudio() { if (!AC && !ATTRACT) try { AC = new AudioContext(); } catch {} }
function tone(f, ms, type = "sine", vol = 0.05) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
  o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + ms / 1000);
}
const bits = [];
function burst(x, y, n, colors) { for (let i = 0; i < n; i++) bits.push({ x, y, vx: rnd(-280, 280), vy: rnd(-460, -120), life: 1, c: pick(colors), r: rnd(0, 6) }); }
function drawFx(dt) {
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i]; p.vy += 760 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 8; p.life -= dt * 0.75;
    if (p.life <= 0) { bits.splice(i, 1); continue; }
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.globalAlpha = Math.min(1, p.life * 2); fctx.fillStyle = p.c; fctx.fillRect(-5, -3, 10, 6); fctx.restore();
  }
}
const seen = { key: "", shown: 0, ph: "", round: "" };
function effects(g) {
  const key = roundKey(g) + g.ph, shown = revealedCount(g);
  if (g.ph === "write" && seen.round !== roundKey(g)) { // a new question: an empty box, ready to type
    seen.round = roundKey(g);
    if (!ATTRACT) { $("fib").value = ""; if (!matchMedia("(pointer: coarse)").matches) $("fib").focus(); }
  }
  if (g.ph === "reveal" && seen.key === key && shown > seen.shown) {
    const i = revealOrder(g)[shown - 1], el = $("opts").querySelector(`[data-o="${i}"]`), r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (i === g.truth) {
      tone(784, 140); setTimeout(() => tone(1175, 220), 120);
      burst(cx, cy, g.votes[net.sessionId] === g.truth ? 90 : 30, ["#35dba8", "#ffc94a", "#ffffff", "#6fb6ff"]);
    } else {
      const fooled = Object.values(g.votes).filter((o) => o === i).length;
      tone(fooled ? 330 : 220, 120, "triangle");
      if (fooled) burst(cx, cy, 10 + fooled * 8, ["#ff6b57", "#ffc94a", "#ef4f9b"]);
    }
  }
  if (g.ph === "results" && seen.ph !== "results") burst(innerWidth / 2, innerHeight * 0.3, 120, COLORS);
  seen.key = key; seen.shown = shown; seen.ph = g.ph;
}

/** Two players picked one color (they joined at once): the later sessionId picks another. Bots' colors count as taken. */
function fixColor() {
  const ps = S.entities.players || {}, botColors = (game()?.bots || []).map((b) => b.c);
  if (!Object.entries(ps).some(([id, p]) => id < net.sessionId && p.c === myColor) && !botColors.includes(myColor)) return;
  const taken = new Set([...Object.entries(ps).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
$("write").addEventListener("submit", (e) => { e.preventDefault(); unlockAudio(); submitFib($("fib").value); });
$("opts").addEventListener("click", (e) => { const b = e.target.closest("[data-o]"); if (b) { unlockAudio(); vote(+b.dataset.o); } });
addEventListener("keydown", (e) => { const g = game(), i = "123456789".indexOf(e.key); if (g && g.ph === "vote" && i >= 0 && document.activeElement.tagName !== "INPUT") vote(i); });
$("again").addEventListener("click", () => { unlockAudio(); if (isHost()) onReady(net.sessionId); else net.send("ready", { r: 1 }); });
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
/** ?attract: my player types a fake like a person and votes, so the preview shows the whole loop. */
const auto = { key: "", text: "", typed: 0, nextAt: 0 };
function autopilot(g) {
  if (!ATTRACT || !g) return;
  const now = performance.now(), key = roundKey(g) + g.ph;
  if (auto.key !== key) {
    auto.key = key; auto.typed = 0; auto.nextAt = now + 250; $("fib").value = "";
    const b = botFibs(g); auto.text = b.list[g.bots.length % b.list.length];
  }
  if (g.ph === "write" && auto.typed <= auto.text.length && now >= auto.nextAt) {
    if (auto.typed < auto.text.length) { auto.typed++; $("fib").value = auto.text.slice(0, auto.typed); auto.nextAt = now + 45; }
    else { auto.typed++; submitFib(auto.text); }
  }
  if (g.ph === "vote" && now >= auto.nextAt + 700 && voteOf(g, net.sessionId) < 0) {
    const truth = g.opts.findIndex((o) => norm(o) === norm(questionOf(g).a)), others = g.opts.map((_, i) => i).filter((i) => i !== truth && i !== mineIdx(g));
    vote(Math.random() < 0.6 || !others.length ? truth : pick(others));
  }
}

let last = performance.now(), lastHb = 0, lastRender = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.was = false; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(); else host.was = false;
  const g = game();
  if (g) { syncFib(); autopilot(g); effects(g); }
  if (now - lastRender > 90) { lastRender = now; render(g); }
  drawFx(dt);
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { seats: 5, lobbyMs: 300, writeMs: 3600, voteMs: 3000, hurryMs: 400, revealLeadMs: 250, revealStepMs: 450, revealEndMs: 1900, resultsMs: 4000, botWriteAt: [0.15, 0.7], botVoteAt: [0.2, 0.7] });
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  if (!net.offline && typeof MP !== "undefined") lb = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const pk = await Seal.init().catch(() => "");
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(game()?.bots || []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  $("name").value = myName;
  net.me.set({ n: myName, c: myColor, hb: Date.now(), pk });
  requestAnimationFrame(frame);
})();
</script>
